<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4702C"/>
      <stop offset="100%" stop-color="#3C2415"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#3C2415" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#3C2415"/>
  <g filter="url(#glow)" transform="translate(10, 12)">
    <!-- Coffee Steam -->
    <path d="M14 4 C14 1, 18 1, 18 -2" stroke="#FAF6F0" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M22 4 C22 1, 26 1, 26 -2" stroke="#FAF6F0" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8"/>
    <!-- Cup Body -->
    <path d="M6 8 H32 L29 30 C28.5 34, 25 37, 20 37 C15 37, 11.5 34, 11 30 Z" fill="#FAF6F0"/>
    <!-- Cup Inner Warm Layer -->
    <path d="M8 10 H30 L27.5 28 C27 32, 24 34.5, 20 34.5 C16 34.5, 13 32, 12.5 28 Z" fill="url(#cupGrad)"/>
    <!-- Cup Handle -->
    <path d="M30 13 H35 C38.5 13, 38.5 24, 33 24 H28" stroke="#FAF6F0" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <!-- Campus Cap / Star Monogram Accent -->
    <circle cx="20" cy="22" r="3" fill="#FAF6F0"/>
  </g>
</svg>
